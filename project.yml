name: PhoneWebcam
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "12.2"
targets:
  PhoneWebcam:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phonewebcam
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: arm64
        VALID_ARCHS: arm64
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Webcam
        NSCameraUsageDescription: Kamera dipakai sebagai webcam untuk PC.
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight]
